name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned
        with:
          persist-credentials: false

      - name: Validate skill metadata, links and asset types
        run: python3 tools/validate_skills.py

      - name: Run validator unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
