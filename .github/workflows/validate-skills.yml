name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned
        with:
          persist-credentials: false

      - name: Validate skill metadata, links and asset types
        run: python3 tools/validate_skills.py

      - name: Run validator unit tests (including offline routing fixtures)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Checkout Rules as read-only data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned
        with:
          repository: ghinta/Rules
          ref: main
          path: _rules
          persist-credentials: false

      - name: Check Rules and Skills routing consistency
        run: python3 tools/check_skill_routing.py --rules-root _rules
